# Mowgli ROS2 — Simulation environment
# Usage:
#   docker compose -f docker-compose.simulation.yaml build
#   docker compose -f docker-compose.simulation.yaml up dev-sim
#
# Foxglove Studio: ws://localhost:8765
# noVNC (simulation GUI): http://localhost:6080
#
# Run E2E test:
#   docker compose -f docker-compose.simulation.yaml exec dev-sim \
#     bash -c "source /ros2_ws/install/setup.bash && python3 /ros2_ws/src/e2e_test.py"

x-ros2-env: &ros2-env
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
  CYCLONEDDS_URI: file:///cyclonedds.xml
  ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
  RCUTILS_COLORIZED_OUTPUT: "1"
  RCUTILS_LOGGING_USE_STDOUT: "1"

services:

  # -------------------------------------------------------------------------
  # Headless simulation — Gazebo + full Nav2 + BT + coverage + Foxglove
  # No GUI, lowest resource usage. Good for CI and automated E2E tests.
  # -------------------------------------------------------------------------
  simulation:
    container_name: mowgli_simulation
    build:
      context: ..
      dockerfile: ros2/Dockerfile
      target: simulation
    network_mode: host
    ipc: host
    environment:
      <<: *ros2-env
    command: >
      bash -lc 'Xvfb :99 -screen 0 1280x720x24 -nolisten tcp &
      export DISPLAY=:99; sleep 1; exec ros2 launch mowgli_bringup sim_full_system.launch.py
      headless:=true
      use_rviz:=false'
    volumes:
      - ./config/cyclonedds.xml:/cyclonedds.xml:ro
      - mowgli_sim_maps:/ros2_ws/maps
      - mowgli_sim_config:/ros2_ws/config
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m

  # -------------------------------------------------------------------------
  # Development simulation — live bind-mounts for config/launch/trees
  # Edit config → restart container → changes take effect (no rebuild).
  # -------------------------------------------------------------------------
  dev-sim:
    container_name: mowgli_dev_sim
    build:
      context: ..
      dockerfile: ros2/Dockerfile
      target: simulation
    network_mode: host
    ipc: host
    environment:
      <<: *ros2-env
    command: >
      bash -lc 'Xvfb :99 -screen 0 1280x720x24 -nolisten tcp &
      export DISPLAY=:99; sleep 1; exec ros2 launch mowgli_bringup sim_full_system.launch.py
      headless:=true
      use_rviz:=false'
    volumes:
      - ./config/cyclonedds.xml:/cyclonedds.xml:ro
      - mowgli_sim_maps:/ros2_ws/maps
      - mowgli_sim_config:/ros2_ws/config
      # Live-edit config (no rebuild needed)
      - ../ros2/src/mowgli_bringup/config:/ros2_ws/install/mowgli_bringup/share/mowgli_bringup/config
      - ../ros2/src/mowgli_bringup/launch:/ros2_ws/install/mowgli_bringup/share/mowgli_bringup/launch
      - ../ros2/src/mowgli_behavior/trees:/ros2_ws/install/mowgli_behavior/share/mowgli_behavior/trees
      - ../ros2/src/mowgli_behavior/config:/ros2_ws/install/mowgli_behavior/share/mowgli_behavior/config
      - ../ros2/src/mowgli_map/config:/ros2_ws/install/mowgli_map/share/mowgli_map/config
      - ../ros2/src/mowgli_localization/config:/ros2_ws/install/mowgli_localization/share/mowgli_localization/config
      - ../ros2/src/mowgli_simulation/launch:/ros2_ws/install/mowgli_simulation/share/mowgli_simulation/launch
      # Webots assets (worlds_webots/, protos/, urdf_webots/, config_webots/)
      # are deliberately NOT bind-mounted — editing them needs an image rebuild.
      # E2E test script
      - ../ros2/src/e2e_test.py:/ros2_ws/src/e2e_test.py
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m

  # -------------------------------------------------------------------------
  # Simulation with VNC GUI — Gazebo visible via browser at :6080
  # Useful for visual debugging and watching the robot mow.
  # -------------------------------------------------------------------------
  simulation-gui:
    container_name: mowgli_sim_gui
    build:
      context: ..
      dockerfile: ros2/Dockerfile
      target: simulation
    ipc: host
    ports:
      - "6080:6080"
      - "8765:8765"
    environment:
      <<: *ros2-env
      DISPLAY: ":1"
    # start_vnc.sh owns the GUI lifecycle: VNC/noVNC plus the single simulator
    # ROS launch. Keeping Compose to one entrypoint prevents two simulators
    # from racing for the same controller and ROS graph.
    command: ["/bin/bash", "/ros2_ws/scripts/start_vnc.sh"]
    volumes:
      - ./config/cyclonedds.xml:/cyclonedds.xml:ro
      - mowgli_sim_maps:/ros2_ws/maps
      - mowgli_sim_config:/ros2_ws/config
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m

  # -------------------------------------------------------------------------
  # Operator web GUI on :4006 — same image and the same foxglove_bridge
  # contract as the robot, pointed at the simulator instead.
  #
  #   docker compose -f docker-compose.simulation.yaml up -d simulation-gui gui
  #   http://localhost:4006
  #
  # FOXGLOVE_URL defaults to the compose-network name of `simulation-gui`.
  # Against the host-network `simulation` service instead, override it:
  #   SIM_FOXGLOVE_URL=ws://host.docker.internal:8765 docker compose … up -d gui
  #
  # /ros2_ws/config is shared with the simulator, so Settings writes the same
  # sparse mowgli_robot.yaml the sim's launch files merge over the template
  # (Invariant 15) — restart the sim service to apply.
  #
  # Not wired here (host-only on a real robot): the docker socket and /dev, so
  # firmware flashing, rosbag and the GNSS tools stay unavailable. Teleop goes
  # through foxglove_bridge — `cmd_vel_ws_relay` (:8766) is not launched by
  # sim_full_system.launch.py, so the GUI uses its fallback publish path.
  # -------------------------------------------------------------------------
  gui:
    container_name: mowgli_sim_web_gui
    image: ${GUI_IMAGE:-ghcr.io/mowglinext/mowglinext/mowglinext-gui:main}
    ports:
      - "4006:4006"
    environment:
      FOXGLOVE_URL: ${SIM_FOXGLOVE_URL:-ws://simulation-gui:8765}
      MOWER_YAML_CONFIG_FILE: /mowgli_config/mowgli_robot.yaml
      DB_PATH: /db
    volumes:
      - mowgli_sim_gui_db:/db
      - mowgli_sim_config:/mowgli_config
      - mowgli_sim_maps:/ros2_ws/maps
    depends_on:
      - simulation-gui
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m

volumes:
  mowgli_sim_maps:
  mowgli_sim_config:
  mowgli_sim_gui_db:
